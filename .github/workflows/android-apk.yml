name: Android test APK

# main'e her gönderimde test APK'sı derlenir ve sabit bağlantıda yayınlanır:
# https://github.com/Ceomai/tycoon/releases/latest/download/tapu-test.apk
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Paketler
        run: npm ci --legacy-peer-deps

      - name: Web paketini derle
        run: npm run build

      # Firebase ayarı (google-services.json) depo sırrı olarak eklenmemişse Firebase'in yerel eklentileri
      # APK'ya konmaz; aksi halde Firebase başlatılmadığı için uygulama açılışta kapanabilir.
      # Oyun bu durumda yerel çalışır (bulut kaydı/sıralama kapalı).
      - name: Firebase ayarı
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "FIREBASE=1" >> "$GITHUB_ENV"
          else
            for p in analytics crashlytics remote-config authentication; do npm pkg delete "dependencies.@capacitor-firebase/$p"; rm -rf "node_modules/@capacitor-firebase/$p"; done
          fi

      - name: Android projesi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          npx cap add android
          if [ "$FIREBASE" = "1" ]; then echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; fi
          npx cap sync android

      - name: Test ayarları (AdMob test uygulama kimliği, sabit debug imzası)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n    </application>#' "$MANIFEST"
          mkdir -p ~/.android
          cp ci/test-debug.keystore ~/.android/debug.keystore

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../tapu-test.apk

      - name: Sürüm notu
        run: echo "Test sürümü · $(date -u '+%Y-%m-%d %H:%M') UTC · ${GITHUB_SHA::7}" > notes.txt

      - name: Yayınla (sabit bağlantı)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-apk
          name: Tapu test APK
          body_path: notes.txt
          files: tapu-test.apk
          make_latest: true
          prerelease: false
